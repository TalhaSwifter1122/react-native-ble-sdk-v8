plugins {
    id 'com.android.library'
}

def localCompileSdk = rootProject.ext.has('compileSdkVersion') ? rootProject.ext.compileSdkVersion : 35
def localMinSdk = rootProject.ext.has('minSdkVersion') ? rootProject.ext.minSdkVersion : 26
def localTargetSdk = rootProject.ext.has('targetSdkVersion') ? rootProject.ext.targetSdkVersion : 35

android {
    namespace 'com.reactnativeblesdkv8'
    compileSdk localCompileSdk

    defaultConfig {
        minSdk Math.max(26, localMinSdk)
        targetSdk localTargetSdk
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}

repositories {
    google()
    mavenCentral()
}

dependencies {
    implementation "com.facebook.react:react-android"
    implementation "androidx.core:core:1.13.1"
    implementation "com.squareup.okhttp3:okhttp:4.12.0"
    // The vendor AAR contains the BLE classes and an unused app-name resource.
    implementation files('libs/blesdk_2301.jar')
}
